name: QA Tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Mondial2026
        uses: actions/checkout@v4
        with:
          path: Mondial2026

      - name: Checkout mundial-qa-automation
        uses: actions/checkout@v4
        with:
          repository: PashaGend/mundial-qa-automation
          path: mundial-qa-automation

      - name: Clean up any leftover containers (defensive, normally a no-op)
        working-directory: mundial-qa-automation
        run: docker compose --env-file .env.docker down --remove-orphans || true

      - name: Start db, rest, gateway, web
        working-directory: mundial-qa-automation
        run: docker compose --env-file .env.docker up -d --build db rest gateway web

      - name: Run tests
        working-directory: mundial-qa-automation
        run: docker compose --env-file .env.docker run --rm tests

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: mundial-qa-automation/playwright-report/
          retention-days: 30

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Mondial2026
        uses: actions/checkout@v4
        with:
          path: Mondial2026

      - name: Checkout mundial-qa-automation
        uses: actions/checkout@v4
        with:
          repository: PashaGend/mundial-qa-automation
          path: mundial-qa-automation

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        working-directory: mundial-qa-automation
        run: |
          docker compose --env-file .env.docker build web
          docker push ghcr.io/pashagend/mundial2026-web:latest
